name: ci-build-test

on:
  pull_request:
    branches:
      - main
      - alpha
      - alpha-*
      - edge
      - edge-*
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Source-built Rexo self-host acceptance (no publication)
        shell: pwsh
        run: ./scripts/Test-SelfHost.ps1

      - name: Publish test results to GitHub Checks
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate coverage summary
        if: ${{ always() && hashFiles('artifacts/test-results/**/*.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            CoverageReport/**
            artifacts/test-results/**/coverage.cobertura.xml

      - name: Upload self-host acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-host-acceptance
          path: |
            artifacts/selfhost/**
            artifacts/packages/*.nupkg
            artifacts/sarif/**
          if-no-files-found: warn
