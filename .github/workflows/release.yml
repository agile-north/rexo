name: release

on:
  push:
    branches:
      - main
      - alpha
      - alpha-*
      - beta
      - beta-*
      - edge
      - edge-*
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    env:
      NUGET_ORG_USER: ${{ secrets.NUGET_ORG_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Compute version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Bootstrap local Rexo CLI
        run: dotnet publish src/Cli/Cli.csproj --configuration Release --output artifacts/rx-bootstrap

      - name: Check repository readiness
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll --non-interactive check

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget-login
        if: ${{ env.NUGET_ORG_USER != '' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_ORG_USER }}

      - name: Verify NuGet publisher identity
        if: ${{ env.NUGET_ORG_USER != '' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet trusted publishing was selected, but the login action did not return an API key."
            exit 1
          fi

      - name: Build, test, pack, tag, and publish with Rexo (NuGet.org)
        if: ${{ env.NUGET_ORG_USER != '' }}
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          NUGET_TARGET_SOURCE: https://api.nuget.org/v3/index.json
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll release --push

      - name: Build, test, pack, tag, and publish with Rexo (GitHub Packages)
        if: ${{ env.NUGET_ORG_USER == '' && vars.PUBLISH_TO_GITHUB_PACKAGES == 'true' }}
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          NUGET_TARGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll release --push

      - name: Build, test, and pack with Rexo (no publisher configured)
        if: ${{ env.NUGET_ORG_USER == '' && vars.PUBLISH_TO_GITHUB_PACKAGES != 'true' }}
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll release

      - name: Publish test results to GitHub Checks
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Results (Release)
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Generate coverage summary
        if: ${{ always() && hashFiles('artifacts/test-results/**/*.cobertura.xml') != '' }}
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          reportgenerator \
            -reports:"artifacts/test-results/**/coverage.cobertura.xml" \
            -targetdir:"CoverageReport" \
            -reporttypes:"Cobertura;MarkdownSummaryGithub"
          cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: artifacts/test-results/**
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-report
          path: |
            CoverageReport/**
            artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Publish schema branch (schema/v<major.minor>, moving)
        if: ${{ env.NUGET_ORG_USER != '' || vars.PUBLISH_TO_GITHUB_PACKAGES == 'true' }}
        run: |
          SCHEMA_VERSION=$(jq -r '.properties.schemaVersion.const' rexo.schema.json)
          SCHEMA_BRANCH="schema/v${SCHEMA_VERSION}"
          git push origin "$GITHUB_SHA:refs/heads/$SCHEMA_BRANCH" --force
          echo "Updated schema branch $SCHEMA_BRANCH to $GITHUB_SHA"

      - name: Create GitHub Release
        if: ${{ env.NUGET_ORG_USER != '' || vars.PUBLISH_TO_GITHUB_PACKAGES == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
          generate_release_notes: true
