name: repository-lifecycle

on:
  pull_request:
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
  push:
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from a release branch
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Compute version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: Select publication
        id: publication
        env:
          REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
          NUGET_ORG_USER: ${{ secrets.NUGET_ORG_USER }}
          GITHUB_PACKAGES: ${{ vars.PUBLISH_TO_GITHUB_PACKAGES }}
        run: |
          publish=false
          source=
          if [ "$REQUESTED" = true ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            case "$GITHUB_REF_NAME" in
              main|alpha|alpha-*|beta|beta-*|edge|edge-*)
                if [ -n "$NUGET_ORG_USER" ]; then
                  source=https://api.nuget.org/v3/index.json
                  publish=true
                elif [ "$GITHUB_PACKAGES" = true ]; then
                  source="https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
                  publish=true
                fi
                ;;
            esac
          fi
          echo "enabled=$publish" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - name: NuGet login
        id: nuget-login
        if: ${{ steps.publication.outputs.enabled == 'true' && steps.publication.outputs.source == 'https://api.nuget.org/v3/index.json' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_ORG_USER }}

      - name: Bootstrap source-built Rexo
        run: dotnet publish src/Cli/Cli.csproj -c Release --output artifacts/rx-bootstrap

      - name: Run Rexo release lifecycle
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          REXO_PUBLISH: ${{ steps.publication.outputs.enabled }}
          NUGET_TARGET_SOURCE: ${{ steps.publication.outputs.source }}
          NUGET_API_KEY: ${{ steps.publication.outputs.enabled == 'true' && (steps.publication.outputs.source == 'https://api.nuget.org/v3/index.json' && steps.nuget-login.outputs.NUGET_API_KEY || steps.publication.outputs.source != 'https://api.nuget.org/v3/index.json' && github.token) || '' }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll --non-interactive --json-file artifacts/selfhost/release.json release

      - name: Generate coverage summary
        if: ${{ always() && hashFiles('artifacts/test-results/**/*.cobertura.xml') != '' }}
        run: |
          dotnet artifacts/rx-bootstrap/Rexo.Cli.dll --non-interactive ci coverage
          cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-evidence
          path: |
            artifacts/selfhost/**
            artifacts/packages/*.nupkg
            artifacts/test-results/**
            artifacts/sarif/**
            artifacts/coverage-report/**
          if-no-files-found: warn

      - name: Publish schema branch
        if: ${{ steps.publication.outputs.enabled == 'true' }}
        run: |
          schema_version=$(jq -r '.properties.schemaVersion.const' rexo.schema.json)
          git push origin "$GITHUB_SHA:refs/heads/schema/v${schema_version}" --force

      - name: Create GitHub Release
        if: ${{ steps.publication.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.gitversion.outputs.preReleaseTag != '' }}
          generate_release_notes: true
