name: release

on:
  pull_request:
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
  push:
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish from a release branch
        type: boolean
        default: false

permissions:
  contents: write
  checks: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      NUGET_ORG_USER: ${{ secrets.NUGET_ORG_USER }}
      GITHUB_PACKAGES: ${{ vars.PUBLISH_TO_GITHUB_PACKAGES }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: '6.x'

      - name: Compute version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: NuGet login
        id: nuget-login
        if: ${{ env.PUBLISH_REQUESTED == 'true' && env.NUGET_ORG_USER != '' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_ORG_USER }}

      - name: Bootstrap source-built Rexo
        run: dotnet publish src/Cli/Cli.csproj -c Release --output artifacts/rx-bootstrap

      - name: Run Rexo release lifecycle
        env:
          GITVERSION_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          PUBLISH_ENABLED: ${{ env.PUBLISH_REQUESTED == 'true' && (env.NUGET_ORG_USER != '' || env.GITHUB_PACKAGES == 'true') }}
          NUGET_TARGET_SOURCE: ${{ env.NUGET_ORG_USER != '' && 'https://api.nuget.org/v3/index.json' || (env.GITHUB_PACKAGES == 'true' && format('https://nuget.pkg.github.com/{0}/index.json', github.repository_owner) || '') }}
          NUGET_API_KEY: ${{ env.PUBLISH_REQUESTED == 'true' && (env.NUGET_ORG_USER != '' && steps.nuget-login.outputs.NUGET_API_KEY || (env.NUGET_ORG_USER == '' && env.GITHUB_PACKAGES == 'true' && github.token)) || '' }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet artifacts/rx-bootstrap/Rexo.Cli.dll --non-interactive --json-file artifacts/selfhost/release.json release --push="$PUBLISH_ENABLED"

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-evidence
          path: |
            artifacts/selfhost/**
            artifacts/packages/*.nupkg
            artifacts/test-results/**
            artifacts/sarif/**
          if-no-files-found: warn
