# yaml-language-server: $schema=https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
$schema: https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
schemaVersion: "1.0"
name: rexo
description: Rexo self-hosted build and release configuration
extends:
  - embedded:standard
  - embedded:dotnet
  - embedded:git-tag
versioning:
  provider: env
  fallback: 0.1.0-local
  settings:
    variable: GITVERSION_SEMVER
vars:
  dotnet:
    solution: solution.slnx
    configuration: Release
    analyze:
      sarif:
        enabled: true
  gitTag:
    prefix: v
    container: none
outputs:
  root: artifacts
  tests:
    results: ~/test-results
    coverage: ~/test-results
  analysis:
    sarif: ~/sarif
runtime:
  push:
    noPushInPullRequest: true
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
commands:
  release:
    description: Verify and build once; publish only when CI selects a publisher and push policy permits it.
    options:
      push:
        type: bool
        default: true
    steps:
      - id: verify
        command: verify
      - id: build
        command: build
      - id: push
        uses: builtin:push-artifacts
        when: "{{options.push && env.REXO_PUBLISH == 'true' && !ci.isPullRequest}}"
      - id: post-push
        command: post-push
        when: "{{push.anyPushed && !options.dry-run}}"
  ci coverage:
    description: Generate coverage reports locally and in CI from the release test evidence.
    steps:
      - id: restore-report-tools
        run: dotnet tool restore
      - id: coverage-summary
        run: >-
          dotnet tool run reportgenerator
          "-reports:{{outputs.tests.results}}/**/coverage.cobertura.xml"
          "-targetdir:{{outputs.root}}/coverage-report"
          "-reporttypes:Cobertura;MarkdownSummaryGithub"
artifacts:
  - type: nuget
    name: Rexo.Cli
    settings:
      project: src/Cli/Cli.csproj
      output: artifacts/packages
      target:
        sourceEnv: NUGET_TARGET_SOURCE
        apiKeyEnv: NUGET_API_KEY
