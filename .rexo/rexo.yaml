# yaml-language-server: $schema=https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
$schema: https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
schemaVersion: "1.0"
name: rexo
description: Rexo self-hosted build and release configuration
extends:
  - embedded:standard
  - embedded:dotnet
  - embedded:git-tag
versioning:
  provider: env
  fallback: 0.1.0-local
  settings:
    variable: GITVERSION_SEMVER
vars:
  dotnet:
    solution: solution.slnx
    configuration: Release
    analyze:
      sarif:
        enabled: true
  gitTag:
    prefix: v
    container: none
outputs:
  root: artifacts
  tests:
    results: ~/test-results
    coverage: ~/test-results
  analysis:
    sarif: ~/sarif
commands:
  ci handoff:
    description: Seal provider-described outputs from a successful unpublished release for transfer.
    steps:
      - id: version
        uses: builtin:resolve-version
      - id: evidence
        uses: builtin:validate-release-evidence
        with:
          runManifest: artifacts/selfhost/release-manifest.json
          result: artifacts/selfhost/release.json
          tests: "{{outputs.tests.results}}"
          sarif: "{{outputs.analysis.sarif}}/dotnet-build.sarif"
          archive: "artifacts/packages/Rexo.Cli.{{version.semver}}.nupkg"
          entry: PACKAGE_README.generated.md
      - id: seal
        uses: builtin:seal-artifact-handoff
        with:
          runManifest: artifacts/selfhost/release-manifest.json
          path: artifacts/selfhost/handoff.json
  ci publish:
    description: Verify and publish prepared artifacts without rebuilding or testing.
    options:
      confirm:
        type: bool
        default: false
    steps:
      - id: version
        uses: builtin:resolve-version
      - id: publish
        uses: builtin:push-artifact-handoff
        with:
          path: artifacts/selfhost/handoff.json
      - id: post-push
        command: post-push
        when: "{{push.anyPushed && !options.dry-run}}"
  ci coverage:
    description: Generate coverage reports locally and in CI from the release test evidence.
    steps:
      - id: restore-report-tools
        run: dotnet tool restore
      - id: coverage-summary
        run: >-
          dotnet tool run reportgenerator
          "-reports:{{outputs.tests.results}}/**/coverage.cobertura.xml"
          "-targetdir:{{outputs.root}}/coverage-report"
          "-reporttypes:Cobertura;MarkdownSummaryGithub"
artifacts:
  - type: nuget
    name: Rexo.Cli
    settings:
      project: src/Cli/Cli.csproj
      output: artifacts/packages
      target:
        sourceEnv: NUGET_TARGET_SOURCE
        apiKeyEnv: NUGET_API_KEY
