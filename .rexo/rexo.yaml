# yaml-language-server: $schema=https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
$schema: https://raw.githubusercontent.com/agile-north/rexo/schema/v1.0/rexo.schema.json
schemaVersion: "1.0"
name: rexo
description: Rexo self-hosted build and release configuration
extends:
  - embedded:standard
  - embedded:dotnet
  - embedded:github-tests
  - embedded:github-coverage
  - embedded:github-release
versioning:
  provider: env
  fallback: 0.1.0-local
  settings:
    variable: GITVERSION_SEMVER
vars:
  dotnet:
    solution: solution.slnx
    configuration: Release
    analyze:
      sarif:
        enabled: true
  githubTests:
    paths: "{{outputs.tests.results}}/**/*.trx"
    format: trx
    missingReports: fail
    uploadArtifact: false
  githubCoverage:
    paths: "{{outputs.tests.coverage}}/**/coverage.cobertura.xml"
    format: cobertura
    outputDirectory: "{{outputs.tests.coverage}}/github-coverage"
    missingReports: fail
    uploadArtifact: false
  schemaBranch: schema/v1.0
outputs:
  root: artifacts
  manifests:
    emit: true
  tests:
    results: ~/test-results
    coverage: ~/test-results
  analysis:
    sarif: ~/sarif
runtime:
  push:
    noPushInPullRequest: true
    branches: [main, alpha, alpha-*, beta, beta-*, edge, edge-*]
commands:
  release:
    merge: append
    steps:
      - id: publish-schema
        when: "{{options.push && push.allPushed && !ci.isPullRequest && !options.dry-run}}"
        run: git push origin "{{repo.commitSha}}:refs/heads/{{vars.schemaBranch}}" --force
artifacts:
  - type: nuget
    name: Rexo.Cli
    settings:
      project: src/Cli/Cli.csproj
      output: artifacts/packages
      target:
        sourceEnv: NUGET_TARGET_SOURCE
        apiKeyEnv: NUGET_API_KEY
